name: CI

on:
  push:
    branches: [main, production]
  # Every PR, including ones stacked on another PR's branch.
  pull_request:

jobs:
  design-system-pin:
    name: Design system is pinned to a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the base branch, to compare versions
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: node scripts/check-design-system-pin.mjs
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event_name == 'pull_request' && 'FETCH_HEAD' || '' }}

  # The widget: install exactly the lockfile (as the Dockerfile does), build it, and run the
  # behaviour tests in Chrome. Design-system update PRs merge only once this passes.
  widget:
    name: Widget build and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chrome

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --ds=chatbot_server.test_settings_postgres -v -m "not xfail"
