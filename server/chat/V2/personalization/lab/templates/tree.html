<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA Lab Tree</title>
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --text: #1d2125; --muted: #5c6670; --line: #d9d6cc;
  --accent: #1b5e8c; --keep: #1c7a3d; --drop: #b3261e; --inconclusive: #a46a00;
  --planned: #6b7280; --blocked: #7a3e9d; --sel: #e4eef6; --code: #efede6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --panel: #1c2024; --text: #e6e8ea; --muted: #9aa4ae; --line: #343a40;
    --accent: #6cb4e4; --keep: #5fd08a; --drop: #ff8a80; --inconclusive: #f0b44c;
    --planned: #9aa4ae; --blocked: #cf9bf0; --sel: #24323d; --code: #262b30;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0; font-size: 18px; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.layout { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; min-height: calc(100vh - 64px); }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 8px 8px 24px 12px; overflow-wrap: anywhere; }
main { padding: 16px; min-width: 0; }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; overflow: auto; }
}
details { margin: 2px 0; }
summary { cursor: pointer; padding: 4px 4px; border-radius: 4px; }
details > details, details > .node { margin-left: 14px; }
.node { display: flex; gap: 6px; align-items: baseline; width: calc(100% - 14px); text-align: left; background: none; color: inherit; border: 0; border-radius: 4px; padding: 4px 6px; font: inherit; cursor: pointer; }
.node:hover, summary:hover { background: var(--sel); }
.node.sel { background: var(--sel); outline: 1px solid var(--accent); }
.mark { font-weight: 700; min-width: 1.1em; text-align: center; }
.v-keep { color: var(--keep); } .v-drop { color: var(--drop); } .v-inconclusive { color: var(--inconclusive); }
.v-planned { color: var(--planned); } .v-blocked { color: var(--blocked); }
h2 { margin: 0 0 4px; font-size: 20px; overflow-wrap: anywhere; }
h3 { margin: 20px 0 6px; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
p { margin: 4px 0; }
.badge { display: inline-block; padding: 1px 8px; border: 1px solid currentColor; border-radius: 10px; font-size: 13px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--code); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.formula { color: var(--muted); min-width: 14em; }
code { background: var(--code); padding: 0 4px; border-radius: 3px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header><h1>LA Lab Tree</h1><p id="meta"></p></header>
<div class="layout"><nav id="tree" aria-label="Aspects and cases"></nav><main id="detail"></main></div>
<script type="application/json" id="lab-data">__LAB_DATA__</script>
<script>
"use strict";
var DATA = JSON.parse(document.getElementById("lab-data").textContent);
var MARKS = {keep: "✓", drop: "✗", inconclusive: "?", planned: "○", blocked: "⊘", running: "…"};

function el(tag, attrs, kids) {
  var node = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === "text") node.textContent = attrs[k];
    else if (k === "class") node.className = attrs[k];
    else node.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (kid) { if (kid) node.appendChild(kid); });
  return node;
}
function safeUrl(url) { return /^https:\/\/[^\s]+$/.test(url || "") ? url : ""; }
function link(url, label) {
  var safe = safeUrl(url);
  return safe ? el("a", {href: safe, text: label, rel: "noopener noreferrer"}) : el("span", {class: "muted", text: label + " (none)"});
}
function mark(state) { return el("span", {class: "mark v-" + state, text: MARKS[state] || "?", title: state}); }
function section(title, body) { return [el("h3", {text: title})].concat(body); }
function table(head, rows, numeric) {
  var th = head.map(function (h) { return el("th", {text: h}); });
  var trs = rows.map(function (row) {
    return el("tr", {}, row.map(function (cell, i) {
      return el("td", {text: cell == null ? "–" : String(cell), class: numeric ? numeric(i) : ""});
    }));
  });
  return el("div", {class: "scroll"}, [el("table", {}, [el("thead", {}, [el("tr", {}, th)]), el("tbody", {}, trs)])]);
}
function mean(values) {
  var nums = values.filter(function (v) { return typeof v === "number"; });
  return nums.length ? nums.reduce(function (a, b) { return a + b; }, 0) / nums.length : null;
}

function allCases() {
  var out = [];
  DATA.aspects.forEach(function (a) { a.cases.forEach(function (c) { out.push(c); }); });
  return out;
}
function find(id) {
  var found = null;
  DATA.aspects.forEach(function (a) {
    if (a.id === id) found = {aspect: a};
    a.cases.forEach(function (c) { if (c.id === id) found = {aspect: a, kase: c}; });
  });
  return found;
}

function renderCase(aspect, c) {
  var box = [];
  box.push(el("h2", {text: c.id}));
  box.push(el("p", {}, [mark(c.mark), el("span", {class: "badge v-" + c.mark, text: c.label})]));
  box.push(el("p", {}, [el("strong", {text: "Question: "}), el("span", {text: c.question})]));
  box.push(el("p", {}, [el("strong", {text: "Why: "}), el("span", {text: c.why})]));
  box.push(el("p", {}, [el("strong", {text: "Source: "}), el("span", {text: c.source})]));
  box.push(el("p", {}, [el("strong", {text: "Branch: "}), link(c.branch_url, c.branch), el("span", {text: "  "}), el("strong", {text: "PR: "}), link(c.pr_url, c.pr_url ? "pull request" : "no PR")]));
  if (c.blocked_reason) box.push(el("p", {class: "v-blocked", text: "Blocked: " + c.blocked_reason}));
  box = box.concat(section("Hypothesis", [el("p", {text: c.hypothesis})]));
  box = box.concat(section("Pass bar (keep if)", [c.bars_text.length ? el("ul", {}, c.bars_text.map(function (t) { return el("li", {text: t}); })) : el("p", {class: "muted", text: "none"})]));
  box = box.concat(section("Mock numbers", [c.mock_rows.length ? table(["metric", "value"], c.mock_rows, function (i) { return i === 1 ? "num" : ""; }) : el("p", {class: "muted", text: "no mock result yet"})]));
  box = box.concat(section("Runs and metrics", [c.columns.length ? table(["metric"].concat(c.columns, ["formula"]), c.metric_rows, function (i) { return i === c.columns.length + 1 ? "formula" : (i > 0 ? "num" : ""); }) : el("p", {class: "muted", text: "no results yet"})]));
  c.step_tables.forEach(function (st) {
    box = box.concat(section("Steps: " + st.column, [table(["step", "what it does", "in", "out"], st.rows, function (i) { return i >= 2 ? "num" : ""; })]));
  });
  box = box.concat(section("Cost", [c.cost_rows.length ? table(["run", "calls", "in tokens", "out tokens", "typed requests", "usd"], c.cost_rows, function (i) { return i > 0 ? "num" : ""; }) : el("p", {class: "muted", text: "no cost yet"})]));
  box = box.concat(section("Verdict", [
    el("p", {}, [mark(c.mark), el("strong", {text: " " + c.label})]),
    c.bar_rows.length ? table(["bar", "target", "observed", "state"], c.bar_rows) : el("p", {class: "muted", text: "no bars evaluated"}),
    c.note ? el("p", {text: "Note: " + c.note}) : null
  ]));
  box.push(el("p", {class: "muted", text: "case_sha: " + (c.case_sha || "unknown")}));
  return box;
}
function renderAspect(a) {
  var box = [el("h2", {text: "Aspect: " + a.id}),
    el("p", {}, [el("strong", {text: "Question: "}), el("span", {text: a.question})]),
    el("p", {}, [el("strong", {text: "Why: "}), el("span", {text: a.why})]),
    el("p", {}, [el("strong", {text: "Source: "}), el("span", {text: a.source})]),
    el("p", {}, [el("strong", {text: "Branch: "}), link(a.branch_url, a.branch || "none")])];
  var rows = a.cases.map(function (c) { return [c.id, c.label, c.headline]; });
  return box.concat(section("Cases", [rows.length ? table(["case", "verdict", "headline metric"], rows) : el("p", {class: "muted", text: "no cases yet"})]));
}
function renderRoot() {
  var counts = {};
  allCases().forEach(function (c) { counts[c.mark] = (counts[c.mark] || 0) + 1; });
  var rows = Object.keys(counts).sort().map(function (k) { return [k, counts[k]]; });
  return [el("h2", {text: "main"}),
    el("p", {text: "Lab core " + (DATA.core_sha || "unknown") + ". " + DATA.aspects.length + " aspects, " + allCases().length + " cases."}),
    rows.length ? table(["verdict", "cases"], rows, function (i) { return i === 1 ? "num" : ""; }) : el("p", {class: "muted", text: "no cases yet"})];
}

function select(id) {
  var detail = document.getElementById("detail");
  detail.textContent = "";
  var found = id ? find(id) : null;
  var nodes = !found ? renderRoot() : found.kase ? renderCase(found.aspect, found.kase) : renderAspect(found.aspect);
  nodes.forEach(function (n) { if (n) detail.appendChild(n); });
  document.querySelectorAll(".node").forEach(function (b) { b.classList.toggle("sel", b.getAttribute("data-id") === id); });
}

function buildTree() {
  var nav = document.getElementById("tree");
  var root = el("details", {open: ""}, [el("summary", {text: "main"})]);
  root.firstChild.addEventListener("click", function () { location.hash = ""; });
  DATA.aspects.forEach(function (a) {
    var d = el("details", {open: ""}, [el("summary", {text: a.id})]);
    d.firstChild.addEventListener("click", function () { location.hash = "#" + a.id; });
    a.cases.forEach(function (c) {
      var b = el("button", {class: "node", type: "button", "data-id": c.id}, [mark(c.mark), el("span", {text: c.id.split("/")[1]})]);
      b.addEventListener("click", function () { location.hash = "#" + c.id; });
      d.appendChild(b);
    });
    root.appendChild(d);
  });
  nav.appendChild(root);
}
document.getElementById("meta").textContent = "Generated " + DATA.generated_at + " from the lab/* branches. Nothing here is written by hand.";
buildTree();
window.addEventListener("hashchange", function () { select(decodeURIComponent(location.hash.slice(1))); });
select(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
