<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sefaria AI{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --ink: #1a1a1a; --muted: #5c5c5c; --bg: #fbfbfa; --card: #fff; --line: #e2e2df; --accent: #18345d; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececea; --muted: #a8a8a4; --bg: #161616; --card: #202020; --line: #343432; --accent: #9db7e0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(440px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p, li { color: var(--muted); }
    ul { padding-left: 20px; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { flex: 1; font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
